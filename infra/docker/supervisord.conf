; ═══════════════════════════════════════════════════════════════════════
; Promptly — Supervisor Configuration
; ═══════════════════════════════════════════════════════════════════════
; Manages Nginx (frontend) and Spring Boot (backend) in a single container.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=java %(ENV_JAVA_OPTS)s org.springframework.boot.loader.launch.JarLauncher
directory=/app
user=promptly
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
; Give backend extra time to start
startsecs=15
