# ── PostgreSQL (R2DBC) Profile ─────────────────────────────────────
# Activate with: PROMPTLY_PERSISTENCE_TYPE=sql SPRING_PROFILES_ACTIVE=postgres
#
# This profile configures PostgreSQL as the SQL database via R2DBC.
# Requires the `persistence-sql` Maven profile (or the unified build)
# to pull in the correct driver and migration dependencies.

promptly:
  persistence:
    type: sql

spring:
  # Disable MongoDB auto-configuration when running in SQL mode
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/promptly}
    username: ${DB_USER:promptly}
    password: ${DB_PASSWORD:promptly}
    pool:
      initial-size: 5
      max-size: 50
      max-idle-time: 30m

  # JDBC DataSource for Spring Modulith event publication (spring-modulith-starter-jdbc)
  datasource:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/promptly}
    username: ${DB_USER:promptly}
    password: ${DB_PASSWORD:promptly}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/promptly}
    user: ${DB_USER:promptly}
    password: ${DB_PASSWORD:promptly}
    locations: classpath:db/migration/postgres
    baseline-on-migrate: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: DEBUG
    # Suppress MongoDB logging in SQL mode
    org.springframework.data.mongodb: OFF
