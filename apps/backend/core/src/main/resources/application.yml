# ── Promptly Configuration ──────────────────────────────────────────
promptly:
  # ── Persistence ──
  persistence:
    type: ${PROMPTLY_PERSISTENCE_TYPE:mongo}

  # ── Auth ──
  auth:
    provider: local                    # local | oidc
    jwt:
      secret: ${JWT_SECRET:promptly-dev-secret-key-DO-NOT-USE-IN-PRODUCTION}
      expiration-ms: 3600000           # 1 hour
      refresh-expiration-ms: 604800000 # 7 days

  # ── Deployment Mode ──
  deployment:
    mode: self-hosted                  # self-hosted | saas

  # ── LLM Configuration (platform defaults) ──
  llm:
    provider: gemini                   # default provider
    model: gemini-2.5-flash      # default model
    temperature: 0.3
    max-tokens: 4096
    api-key: ${PROMPTLY_LLM_API_KEY:}  # from env var — never commit real keys
    # credential-encryption-key: ${PROMPTLY_LLM_CREDENTIAL_ENCRYPTION_KEY:}  # enable for SaaS mode
    scanner:
      model: gemini-2.5-flash    # cheaper/faster model for bulk scanning
    improver:
      model: gemini-2.5-flash
    embedding:
      provider: gemini
      model: text-embedding-004

  # ── Rate Limiting (disabled by default — enable if not using external gateway) ──
  rate-limit:
    enabled: false                     # set to true to enable app-level rate limiting
    requests-per-second: 100
    login-requests-per-minute: 5

spring:
  application:
    name: promptly

  profiles:
    active: dev

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/promptly?maxPoolSize=50&minPoolSize=5&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000}
    database: ${MONGODB_DATABASE:promptly}
    auto-index-creation: false

  # Spring AI — Google Gemini via Vertex AI
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:spectrayan-ai}
          location: ${GCP_REGION:us-central1}
          chat:
            options:
              model: gemini-2.5-flash
              temperature: 0.3
          transport: REST

  modulith:
    events:
      republish-outstanding-events-on-restart: false

server:
  port: 8080
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# ── Spectrayan SSE Server Library ──
spectrayan:
  sse:
    server:
      enabled: true
      base-path: /api/v1/sse
      stream:
        heartbeat-enabled: true
        heartbeat-interval: 15s
        connected-event-enabled: true
        retry-enabled: true
        retry: 3s
      topics:
        # v1.2.0: Automatic cleanup of idle topics (no subscribers)
        idle-ttl: 5m
      # v1.2.0: Micrometer metrics for SSE observability
      metrics:
        enabled: true
        per-topic: true
      # Use REPLAY sink so events aren't dropped during subscriber connection setup.
      # MULTICAST (default) drops events instantly if no subscriber is listening.
      emitter:
        sink-type: REPLAY
        replay-size: 5
      cors:
        enabled: true
        allowed-origins:
          - "http://localhost:4200"
          - "http://localhost:8080"
        allowed-methods:
          - GET
        allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ── Resilience4j (Circuit Breakers + Retries for LLM calls) ──
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
      llm:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-duration-threshold: 120s
        slow-call-rate-threshold: 90
    instances:
      llm-scanner:
        base-config: llm
      llm-improver:
        base-config: llm
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.reactive.function.client.WebClientException
    instances:
      llm-scanner:
        base-config: default
      llm-improver:
        base-config: default


logging:
  level:
    com.promptly: DEBUG
    org.springframework.modulith: DEBUG
    org.springframework.data.mongodb: DEBUG
    # Suppress WARN from SSE EmissionService when emitting to topics with no subscribers.
    # FAIL_NON_SERIALIZED is Reactor's Sinks.EmitResult for "no subscribers" — not a serialization error.
    # The SseNotificationAdapter already handles this gracefully at DEBUG level.
    com.spectrayan.sse.server.emitter.EmissionService: ERROR
