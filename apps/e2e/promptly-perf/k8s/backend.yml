# Promptly Backend — 2-replica deployment for performance testing
# Resource limits simulate production-like constraints for realistic results.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: promptly-perf
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: promptly-backend:perf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_MONGODB_URI
              value: mongodb://mongodb.promptly-perf.svc.cluster.local:27017/promptly
            - name: SPRING_MONGODB_DATABASE
              value: promptly
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: perf
            - name: SPRING_AI_VERTEX_AI_GEMINI_ENABLED
              value: "false"
            # JVM heap tuning — adjust for perf testing
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=60.0
                -XX:+UseG1GC
                -XX:+UseStringDeduplication
                -Dreactor.netty.ioWorkerCount=4
          resources:
            requests:
              cpu: "1"
              memory: 1536Mi
            limits:
              cpu: "4"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /actuator
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: promptly-perf
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
