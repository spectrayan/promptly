# ═══════════════════════════════════════════════════════════════════════
# Promptly — Nginx Configuration for Performance Testing
#
# Serves two roles:
#   1. API Load Balancer (port 8080) — round-robin to backend-1, backend-2
#   2. Frontend Static Server (port 4200) — serves Angular production build
# ═══════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────
    log_format perf '$remote_addr - $request_time $upstream_response_time '
                    '$status $body_bytes_sent "$request"';
    access_log /var/log/nginx/access.log perf;

    sendfile     on;
    tcp_nopush   on;
    gzip         on;
    gzip_types   text/plain application/json application/javascript text/css;

    # ── Backend Upstream (Round Robin) ───────────
    upstream promptly_backend {
        server backend-1:8080;
        server backend-2:8080;
    }

    # ── API Load Balancer (port 8080) ────────────
    server {
        listen 8080;
        server_name localhost;

        # Health check endpoint for Docker
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://promptly_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }
    }

    # ── Frontend Static Server (port 4200) ───────
    server {
        listen 4200;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA routing — fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy — forward to backend LB
        location /api/ {
            proxy_pass http://promptly_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
