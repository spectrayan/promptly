# Prometheus configuration for Promptly performance testing
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Promptly backend (via K8s NodePort through Docker host)
  - job_name: 'promptly-perf'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:30080']
        labels:
          environment: 'perf'
          app: 'promptly-backend'
