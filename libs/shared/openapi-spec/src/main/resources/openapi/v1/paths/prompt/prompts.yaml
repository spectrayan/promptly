post:
  operationId: createPrompt
  summary: Create a new prompt
  description: Creates a new prompt with version 1. Emits `PromptCreated` event which triggers auto-scan and embedding generation.
  tags: [Prompts]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/prompt/CreatePromptRequest.yaml'
  responses:
    '201':
      description: Prompt created successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/prompt/PromptResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalServerError.yaml'

get:
  operationId: listPrompts
  summary: List prompts (paginated)
  description: Returns a paginated, streaming list of prompt summaries. Optionally filter by project ID.
  tags: [Prompts, PromptlyQuery]
  parameters:
    - name: projectId
      in: query
      required: false
      description: Filter prompts by project ID
      schema:
        type: string
    - name: page
      in: query
      required: false
      description: Page number (0-indexed)
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: sort
      in: query
      required: false
      description: "Sort criteria (e.g. createdAt,desc)"
      schema:
        type: string
  responses:
    '200':
      description: List of prompt summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/prompt/PromptSummaryResponse.yaml'
