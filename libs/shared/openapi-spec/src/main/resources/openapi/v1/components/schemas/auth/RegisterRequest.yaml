type: object
required: [email, password, displayName]
properties:
  email:
    type: string
    format: email
    description: User's email address (used as login identifier)
    minLength: 5
    maxLength: 254
    example: alice@promptly.ai
  password:
    type: string
    format: password
    minLength: 8
    maxLength: 128
    description: Password (min 8 characters)
    example: P@ssw0rd123
  displayName:
    type: string
    description: User's display name
    minLength: 1
    maxLength: 200
    example: Alice Johnson
