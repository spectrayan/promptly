get:
  operationId: getLatestScanResult
  summary: Get latest scan result
  description: Returns the most recent scan result for a prompt.
  tags: [Scanner]
  parameters:
    - $ref: '../../components/parameters/PromptIdPath.yaml'
  responses:
    '200':
      description: Latest scan result
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/scanner/ScanResponse.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
