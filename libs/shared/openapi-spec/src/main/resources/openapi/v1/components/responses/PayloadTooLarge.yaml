description: The request payload is too large (prompt content exceeds maximum allowed size)
headers:
  X-Request-Id:
    description: Unique request identifier for tracing
    schema:
      type: string
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
content:
  application/problem+json:
    schema:
      $ref: '../schemas/common/ProblemDetails.yaml'
    example:
      type: "https://api.promptly.dev/problems/payload-too-large"
      title: "Payload Too Large"
      status: 413
      detail: "Prompt content exceeds maximum allowed size of 50KB"
      instance: "/api/v1/prompts"
      timestamp: "2026-04-23T12:00:00.000Z"
      traceId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
