type: object
properties:
  id:
    type: string
  name:
    type: string
  description:
    type: string
  projectId:
    type: string
  status:
    $ref: '../common/enums/PromptStatus.yaml'
  currentVersion:
    type: integer
  updatedAt:
    type: string
    format: date-time
  tags:
    type: array
    items:
      type: string
  scanStatus:
    type: string
    enum: [PASS, WARN, FAIL, NONE]
