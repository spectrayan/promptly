get:
  operationId: getCurrentUser
  summary: Get current authenticated user
  description: Returns the profile of the currently authenticated user from the JWT token.
  tags: [Auth]
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Current user profile
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth/UserResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'

patch:
  operationId: updateCurrentUser
  summary: Update current user profile
  description: Updates the display name and/or avatar of the authenticated user.
  tags: [Auth]
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/UpdateUserRequest.yaml'
  responses:
    '200':
      description: Updated user profile
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth/UserResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
