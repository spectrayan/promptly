get:
  operationId: listProjects
  summary: List projects (paginated)
  description: Returns a paginated list of projects the current user has access to.
  tags: [Projects, PromptlyQuery]
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (0-indexed)
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: sort
      in: query
      required: false
      description: "Sort criteria (e.g. createdAt,desc)"
      schema:
        type: string
  responses:
    '200':
      description: List of projects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/project/ProjectResponse.yaml'

post:
  operationId: createProject
  summary: Create a new project
  description: Creates a new project. The creator automatically becomes ADMIN.
  tags: [Projects]
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/project/CreateProjectRequest.yaml'
  responses:
    '201':
      description: Project created
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/project/ProjectResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '409':
      $ref: '../../components/responses/Conflict.yaml'
