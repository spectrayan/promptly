type: object
description: >-
  RFC 9457 Problem Details for HTTP APIs — Standard error response format.
  Extension members (code, timestamp, traceId, errors) are permitted per §3.1.
required:
  - type
  - title
  - status
properties:
  # ── RFC 9457 standard members ──────────────────────────────────────
  type:
    type: string
    format: uri
    description: URI reference identifying the problem type (§3.1.1)
    example: "https://promptly.dev/errors/conflict"
  title:
    type: string
    description: Short, human-readable summary of the problem type (§3.1.2)
    example: "Duplicate Resource"
  status:
    type: integer
    description: HTTP status code generated by the origin server for this occurrence (§3.1.3)
    minimum: 100
    maximum: 599
    example: 409
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence (§3.1.4)
    example: "A prompt named 'Welcome' already exists in this project"
  instance:
    type: string
    format: uri
    description: URI reference identifying the specific occurrence of the problem (§3.1.5)
    example: "/api/v1/prompts"

  # ── Extension members (RFC 9457 §3.1 permits these) ────────────────
  code:
    type: string
    description: Machine-readable error code for frontend error message mapping
    example: "PROMPT_DUPLICATE_NAME"
  timestamp:
    type: string
    format: date-time
    description: Timestamp when the error occurred (ISO 8601 format)
    example: "2026-04-25T12:00:00.000Z"
  traceId:
    type: string
    description: Unique trace ID for debugging and log correlation
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  errors:
    type: array
    description: Field-level validation errors (for 400 Bad Request responses)
    items:
      $ref: '../common/ValidationError.yaml'
