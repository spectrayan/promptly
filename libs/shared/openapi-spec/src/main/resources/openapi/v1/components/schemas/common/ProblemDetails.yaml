type: object
description: RFC 9457 Problem Details for HTTP APIs — Standard error response format
required:
  - type
  - title
  - status
properties:
  type:
    type: string
    format: uri
    description: URI reference identifying the problem type (should resolve to human-readable documentation)
    example: "https://api.promptly.dev/problems/validation-error"
  title:
    type: string
    description: Short, human-readable summary of the problem type
    example: "Validation Error"
  status:
    type: integer
    description: HTTP status code generated by the origin server for this occurrence
    minimum: 100
    maximum: 599
    example: 400
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence of the problem
    example: "The 'name' field is required"
  instance:
    type: string
    format: uri
    description: URI reference identifying the specific occurrence of the problem
    example: "/api/v1/prompts"
  timestamp:
    type: string
    format: date-time
    description: Timestamp when the error occurred (ISO 8601 format)
    example: "2026-04-23T12:00:00.000Z"
  traceId:
    type: string
    description: Unique trace ID for debugging and log correlation
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  errors:
    type: array
    description: Field-level validation errors (for 400 Bad Request responses)
    items:
      $ref: '../common/ValidationError.yaml'
