description: Rate limit exceeded
headers:
  X-Request-Id:
    description: Unique request identifier for tracing
    schema:
      type: string
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  Retry-After:
    description: Number of seconds until the rate limit resets
    schema:
      type: integer
      example: 60
  X-RateLimit-Limit:
    description: Maximum number of requests per window
    schema:
      type: integer
      example: 100
  X-RateLimit-Remaining:
    description: Remaining requests in current window
    schema:
      type: integer
      example: 0
content:
  application/problem+json:
    schema:
      $ref: '../schemas/common/ProblemDetails.yaml'
    example:
      type: "https://api.promptly.dev/problems/rate-limit-exceeded"
      title: "Too Many Requests"
      status: 429
      detail: "Rate limit of 100 requests per minute exceeded. Retry after 60 seconds."
      instance: "/api/v1/deliver"
      timestamp: "2026-04-23T12:00:00.000Z"
      traceId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
