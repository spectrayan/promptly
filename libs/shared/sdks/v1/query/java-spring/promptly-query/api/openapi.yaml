openapi: 3.1.0
info:
  contact:
    name: Promptly Team
    url: https://promptly.dev
  description: |
    Enterprise AI Prompt Governance Platform — REST API

    Promptly enables organizations to manage, version, secure, and deploy AI prompts
    with full governance controls. This specification covers all seven bounded contexts:
    Prompt Registry, Workflow Engine, Vulnerability Scanner, Quality Improver,
    Runtime Delivery, Audit & Compliance, and Semantic Search.
  license:
    name: Proprietary
    url: https://promptly.dev/license
  title: Promptly API
  version: 1.0.0
servers:
- description: Local development server
  url: http://localhost:8080
- description: Production server
  url: https://api.promptly.dev
tags:
- description: "Authentication — registration, login, token management (LOCAL mode)"
  name: Auth
- description: "Projects — RBAC boundaries, team management"
  name: Projects
- description: "Prompt Registry — CRUD, versioning, and rollback"
  name: Prompts
- description: Workflow Engine — multi-step approval and environment promotion
  name: Workflows
- description: Vulnerability Scanner — LLM-powered prompt security analysis
  name: Scanner
- description: Quality Improver — AI-assisted prompt refinement
  name: Improver
- description: Runtime Delivery — low-latency prompt serving for AI agents
  name: Delivery
- description: Audit & Compliance — immutable audit trail
  name: Audit
- description: Semantic Search — embedding-based prompt discovery
  name: Search
- description: "Notifications — real-time SSE alerts, preferences, and project settings"
  name: Notifications
- description: "External read-only API — query projects, prompts, delivery, and search\
    \ for external consumers"
  name: PromptlyQuery
paths:
  /api/v1/auth/register:
    post:
      description: |
        Creates a new user account with the LOCAL auth provider.
        The first registered user automatically becomes ORG_ADMIN.
        Disabled when auth provider is set to OIDC.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: User registered successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
      summary: Register a new user
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/auth/login:
    post:
      description: |
        Authenticates a user with email/password and returns JWT tokens.
        Disabled when auth provider is set to OIDC.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Login successful
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Login with email and password
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/auth/refresh:
    post:
      description: Exchanges a valid refresh token for a new access token pair.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Token refreshed successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Refresh access token
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/auth/me:
    get:
      description: Returns the profile of the currently authenticated user from the
        JWT token.
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Current user profile
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - Auth
      x-accepts:
      - application/json
      - application/problem+json
    patch:
      description: Updates the display name and/or avatar of the authenticated user.
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Updated user profile
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/auth/me/preferences:
    get:
      description: Returns the notification and platform preferences for the authenticated
        user.
      operationId: getUserPreferences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
          description: Current user preferences
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - BearerAuth: []
      summary: Get user preferences
      tags:
      - Auth
      x-accepts:
      - application/json
      - application/problem+json
    patch:
      description: Updates notification settings and other preferences.
      operationId: updateUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferences"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
          description: Updated user preferences
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - BearerAuth: []
      summary: Update user preferences
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/users:
    get:
      description: |
        Returns a list of users matching the search query.
        Used for project member picker (autocomplete).
        Requires authentication.
      operationId: listUsers
      parameters:
      - description: Search query (matches email or display name)
        explode: true
        in: query
        name: q
        required: false
        schema:
          example: alice
          type: string
        style: form
      - description: Maximum number of results
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserResponse"
                type: array
          description: List of matching users
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - BearerAuth: []
      summary: Search users
      tags:
      - Auth
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/projects:
    get:
      description: Returns a paginated list of projects the current user has access
        to.
      operationId: listProjects
      parameters:
      - description: Page number (0-indexed)
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Sort criteria (e.g. createdAt,desc)"
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProjectResponse"
                type: array
          description: List of projects
      security:
      - BearerAuth: []
      summary: List projects (paginated)
      tags:
      - Projects
      - PromptlyQuery
      x-accepts:
      - application/json
    post:
      description: Creates a new project. The creator automatically becomes ADMIN.
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: Project created
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - BearerAuth: []
      summary: Create a new project
      tags:
      - Projects
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
          description: Project details
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - BearerAuth: []
      summary: Get project by ID
      tags:
      - Projects
      - PromptlyQuery
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProjectMemberResponse"
                type: array
          description: List of project members
      security:
      - BearerAuth: []
      summary: List project members
      tags:
      - Projects
      x-accepts:
      - application/json
    post:
      operationId: addProjectMember
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - BearerAuth: []
      summary: Add a member to a project
      tags:
      - Projects
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      operationId: removeProjectMember
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Member removed
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - BearerAuth: []
      summary: Remove a member from a project
      tags:
      - Projects
      x-accepts:
      - application/problem+json
    put:
      operationId: updateProjectMember
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
          description: Member updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - BearerAuth: []
      summary: Update a project member's role
      tags:
      - Projects
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts:
    get:
      description: "Returns a paginated, streaming list of prompt summaries. Optionally\
        \ filter by project ID."
      operationId: listPrompts
      parameters:
      - description: Filter prompts by project ID
        explode: true
        in: query
        name: projectId
        required: false
        schema:
          type: string
        style: form
      - description: Page number (0-indexed)
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Sort criteria (e.g. createdAt,desc)"
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PromptSummaryResponse"
                type: array
          description: List of prompt summaries
      summary: List prompts (paginated)
      tags:
      - Prompts
      - PromptlyQuery
      x-accepts:
      - application/json
    post:
      description: Creates a new prompt with version 1. Emits `PromptCreated` event
        which triggers auto-scan and embedding generation.
      operationId: createPrompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
          description: Prompt created successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Create a new prompt
      tags:
      - Prompts
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/{id}:
    delete:
      description: Permanently deletes a prompt and all its versions.
      operationId: deletePrompt
      parameters:
      - $ref: "#/components/parameters/PromptId"
      responses:
        "204":
          description: Prompt deleted
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Delete a prompt
      tags:
      - Prompts
      x-accepts:
      - application/problem+json
    get:
      description: "Returns full prompt details including latest content, tags, and\
        \ timestamps."
      operationId: getPrompt
      parameters:
      - $ref: "#/components/parameters/PromptId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
          description: Prompt details
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Get prompt details
      tags:
      - Prompts
      - PromptlyQuery
      x-accepts:
      - application/json
      - application/problem+json
    put:
      description: Creates a new version of the prompt with updated content. Emits
        `PromptUpdated` event which triggers auto-scan and embedding refresh.
      operationId: updatePrompt
      parameters:
      - $ref: "#/components/parameters/PromptId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
          description: Prompt updated with new version
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Update prompt content
      tags:
      - Prompts
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/{id}/versions:
    get:
      description: "Returns all versions of a prompt, ordered by version number."
      operationId: getVersionHistory
      parameters:
      - $ref: "#/components/parameters/PromptId"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/VersionResponse"
                type: array
          description: Version history
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Get version history
      tags:
      - Prompts
      - PromptlyQuery
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/{id}/versions/{versionNumber}:
    get:
      description: Returns the content and metadata of a specific prompt version.
      operationId: getSpecificVersion
      parameters:
      - $ref: "#/components/parameters/PromptId"
      - explode: false
        in: path
        name: versionNumber
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
          description: Version details
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Get a specific version
      tags:
      - Prompts
      - PromptlyQuery
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/{id}/rollback/{targetVersion}:
    post:
      description: Restores prompt content from a previous version and creates a new
        version with that content. Emits `PromptRolledBack` event.
      operationId: rollbackPrompt
      parameters:
      - $ref: "#/components/parameters/PromptId"
      - explode: false
        in: path
        name: targetVersion
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      - explode: true
        in: query
        name: author
        required: false
        schema:
          default: system
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
          description: Prompt rolled back
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Rollback to a previous version
      tags:
      - Prompts
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/generate:
    post:
      description: |
        Uses a dedicated LLM system prompt to transform a short idea description into a
        fully-structured AI prompt. Unlike the improve endpoint, this does not require an
        existing prompt — it creates content from scratch.
      operationId: generateFromIdea
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFromIdeaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateFromIdeaResponse"
          description: Generated prompt content
        "400":
          $ref: "#/components/responses/BadRequest"
      summary: Generate a prompt from a natural-language idea
      tags:
      - Prompts
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/workflows:
    get:
      description: "Returns workflows, optionally filtered by prompt ID, project ID,\
        \ or pending status."
      operationId: listWorkflows
      parameters:
      - description: Filter workflows by project ID
        explode: true
        in: query
        name: projectId
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: promptId
        required: false
        schema:
          type: string
        style: form
      - description: Only return pending workflows
        explode: true
        in: query
        name: pendingOnly
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Page number (0-indexed)
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Sort criteria (e.g. createdAt,desc)"
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WorkflowResponse"
                type: array
          description: List of workflows
      summary: List workflows (paginated)
      tags:
      - Workflows
      x-accepts:
      - application/json
  /api/v1/workflows/submit-review:
    post:
      description: Creates a new multi-step approval workflow. Emits `ReviewSubmitted`
        event.
      operationId: submitForReview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Workflow created
        "400":
          $ref: "#/components/responses/BadRequest"
      summary: Submit a prompt for review
      tags:
      - Workflows
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/workflows/{id}:
    get:
      description: Returns full workflow details including approval steps.
      operationId: getWorkflow
      parameters:
      - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Workflow details
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Get workflow details
      tags:
      - Workflows
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/workflows/{id}/approve:
    post:
      description: "Approves the current step. If all steps are approved, workflow\
        \ moves to `APPROVED` and emits `WorkflowApproved` event."
      operationId: approveWorkflow
      parameters:
      - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Workflow step approved
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Approve current workflow step
      tags:
      - Workflows
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/workflows/{id}/reject:
    post:
      description: Rejects the workflow with a reason. Emits `WorkflowRejected` event.
      operationId: rejectWorkflow
      parameters:
      - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Workflow rejected
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Reject workflow
      tags:
      - Workflows
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /api/v1/prompts/{promptId}/scan:
    post:
      description: Runs an LLM-powered vulnerability analysis on the prompt's latest
        version.
      operationId: triggerScan
      parameters:
      - $ref: "#/components/parameters/PromptIdPath"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
          description: Scan results
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Trigger a vulnerability scan
      tags:
      - Scanner
      x-accepts:
      - application/json
      - application/problem+json
