components:
  parameters:
    PromptId:
      description: Unique prompt identifier
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    PromptIdPath:
      description: Prompt identifier
      explode: false
      in: path
      name: promptId
      required: true
      schema:
        type: string
      style: simple
    WorkflowId:
      description: Unique workflow identifier
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/problem+json:
          example:
            type: https://api.promptly.dev/problems/validation-error
            title: Validation Error
            status: 400
            detail: One or more validation errors occurred
            instance: /api/v1/prompts
            timestamp: 2026-04-23T12:00:00.000Z
            traceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            errors:
            - field: name
              message: must not be blank
              rejectedValue: ""
              code: REQUIRED_FIELD
            - field: content
              message: must not be blank
              code: REQUIRED_FIELD
          schema:
            $ref: "#/components/schemas/ProblemDetails"
      description: "The request was invalid or malformed (validation errors, missing\
        \ required fields, etc.)"
      headers:
        X-Request-Id:
          description: Unique request identifier for tracing
          explode: false
          schema:
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            type: string
          style: simple
    Unauthorized:
      content:
        application/problem+json:
          example:
            type: https://api.promptly.dev/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication credentials are missing or invalid
            instance: /api/v1/prompts
            timestamp: 2026-04-23T12:00:00.000Z
            traceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          schema:
            $ref: "#/components/schemas/ProblemDetails"
      description: Authentication is required and has failed or has not been provided
      headers:
        WWW-Authenticate:
          description: Authentication scheme and realm
          explode: false
          schema:
            example: Bearer realm="Promptly API"
            type: string
          style: simple
        X-Request-Id:
          description: Unique request identifier for tracing
          explode: false
          schema:
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            type: string
          style: simple
    Forbidden:
      content:
        application/problem+json:
          example:
            type: https://api.promptly.dev/problems/forbidden
            title: Forbidden
            status: 403
            detail: You do not have permission to approve this workflow
            instance: /api/v1/workflows/69e9810348a38508fe0a132b/approve
            timestamp: 2026-04-23T12:00:00.000Z
            traceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          schema:
            $ref: "#/components/schemas/ProblemDetails"
      description: The authenticated user does not have permission to access this
        resource
      headers:
        X-Request-Id:
          description: Unique request identifier for tracing
          explode: false
          schema:
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            type: string
          style: simple
    NotFound:
      content:
        application/problem+json:
          example:
            type: https://api.promptly.dev/problems/not-found
            title: Not Found
            status: 404
            detail: Prompt with ID '69e980f848a38508fe0a1324' was not found
            instance: /api/v1/prompts/69e980f848a38508fe0a1324
            timestamp: 2026-04-23T12:00:00.000Z
            traceId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          schema:
            $ref: "#/components/schemas/ProblemDetails"
      description: The requested resource was not found
