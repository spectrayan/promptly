    ProblemDetails:
      description: "RFC 9457 Problem Details for HTTP APIs — Standard error response\
        \ format. Extension members (code, timestamp, traceId, errors) are permitted\
        \ per §3.1."
      properties:
        type:
          description: URI reference identifying the problem type (§3.1.1)
          example: https://promptly.dev/errors/conflict
          format: uri
          type: string
        title:
          description: "Short, human-readable summary of the problem type (§3.1.2)"
          example: Duplicate Resource
          type: string
        status:
          description: HTTP status code generated by the origin server for this occurrence
            (§3.1.3)
          example: 409
          maximum: 599
          minimum: 100
          type: integer
        detail:
          description: Human-readable explanation specific to this occurrence (§3.1.4)
          example: A prompt named 'Welcome' already exists in this project
          type: string
        instance:
          description: URI reference identifying the specific occurrence of the problem
            (§3.1.5)
          example: /api/v1/prompts
          format: uri
          type: string
        code:
          description: Machine-readable error code for frontend error message mapping
          example: PROMPT_DUPLICATE_NAME
          type: string
        timestamp:
          description: Timestamp when the error occurred (ISO 8601 format)
          example: 2026-04-25T12:00:00.000Z
          format: date-time
          type: string
        traceId:
          description: Unique trace ID for debugging and log correlation
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          type: string
        errors:
          description: Field-level validation errors (for 400 Bad Request responses)
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
      required:
      - status
      - title
      - type
    ValidationError:
      description: Field-level validation error details
      properties:
        field:
          description: Name of the field that failed validation
          example: name
          type: string
        message:
          description: Validation error message for this field
          example: must not be blank
          type: string
        rejectedValue:
          description: The value that was rejected (may be null)
          example: ""
          type: string
          nullable: true
        code:
          description: Machine-readable error code for this field
          example: REQUIRED_FIELD
          type: string
      required:
      - field
      - message
