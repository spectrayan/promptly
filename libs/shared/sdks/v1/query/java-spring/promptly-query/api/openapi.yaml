        - icon: icon
          title: title
          key: key
          messageTemplate: messageTemplate
        enabledEvents:
        - enabledEvents
        - enabledEvents
        projectId: projectId
      properties:
        projectId:
          type: string
        enabledEvents:
          description: Event type keys enabled for this project
          items:
            type: string
          type: array
        availableEvents:
          description: All available notification event types
          items:
            $ref: "#/components/schemas/NotificationEventTypeInfo"
